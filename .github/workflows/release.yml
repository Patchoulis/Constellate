name: Release

# Pushing a tag vX.Y.Z builds the Windows installer and publishes a GitHub release with it attached, whose
# notes are that version's section of CHANGELOG.md.
#
# Two jobs, so that only the one that publishes may write: the build installs and runs every dependency's
# scripts, and does it with a token that can only read.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

# Actions are pinned to the commit of a release (named in the comment): a tag can be moved, a commit cannot.
jobs:
  build:
    name: Build the installer
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # the whole history, to see that the tagged commit is on main
          fetch-depth: 0
      - name: The tag is a version on main, and package.json and the changelog agree with it
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::the tag $TAG is not vX.Y.Z"
            exit 1
          fi
          # a release is made from main (CLAUDE.md, "Release"), not from a commit of some other branch
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "::error::the tag says $version but package.json says $declared"
            exit 1
          fi
          # the lines between this version's heading and the next one
          awk -v version="$version" '
            /^## \[/ { printing = (index($0, "## [" version "]") == 1); next }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entries under [$version]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer
        run: npm run dist
      - name: The installer is there and is not empty, and its checksum is written down
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          installer="Constellate-Setup-$VERSION.exe"
          test "$(stat -c %s "dist/$installer")" -gt 50000000
          cp "dist/$installer" notes.md release/
          (cd release && sha256sum "$installer" > "$installer.sha256" && sha256sum --check "$installer.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          # what was built is what is published: the checksum is checked again after the hand-over
          sha256sum --check "Constellate-Setup-$VERSION.exe.sha256"
          gh release create "$TAG" --title "Constellate $VERSION" --notes-file notes.md --verify-tag \
            "Constellate-Setup-$VERSION.exe" "Constellate-Setup-$VERSION.exe.sha256"
