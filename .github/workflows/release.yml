name: Release

# Pushing a tag vX.Y.Z on main builds the Windows installer (on Windows) and the Linux AppImage and .deb (on
# Linux), and publishes one GitHub release with all of them and their SHA-256 checksums, whose notes are that
# version's section of CHANGELOG.md.
#
# Separate jobs, so that only the one that publishes may write: the builds install and run every dependency's
# scripts, and do it with a token that can only read.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

# Actions are pinned to the commit of a release (named in the comment): a tag can be moved, a commit cannot.
jobs:
  version:
    name: The tag is a version on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # the whole history, to see that the tagged commit is on main
          fetch-depth: 0
      - name: The tag is a version on main, and package.json and the changelog agree with it
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::the tag $TAG is not vX.Y.Z"
            exit 1
          fi
          # a release is made from main (CLAUDE.md, "Release"), not from a commit of some other branch
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "::error::the tag says $version but package.json says $declared"
            exit 1
          fi
          # the lines between this version's heading and the next one
          mkdir notes
          awk -v version="$version" '
            /^## \[/ { printing = (index($0, "## [" version "]") == 1); next }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "::error::CHANGELOG.md has no entries under [$version]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: notes/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build for ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            # the files electron-builder makes (electron-builder.yml artifactName), for the version
            files: Constellate-Setup-{version}.exe
          - name: Linux
            os: ubuntu-latest
            files: Constellate-{version}-x86_64.AppImage Constellate-{version}-amd64.deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the interface, the engine (release, for this system), the engine staged and started once, the packages
      - name: Build the packages
        run: npm run dist
      - name: Each package is there and is not empty, and its checksum is written down
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FILES: ${{ matrix.files }}
        run: |
          mkdir release
          for name in ${FILES//\{version\}/$VERSION}; do
            test "$(stat -c %s "dist/$name")" -gt 50000000
            cp "dist/$name" release/
            (cd release && sha256sum "$name" > "$name.sha256" && sha256sum --check "$name.sha256")
          done
          ls -l release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.name }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release
          # what was built is what is published: every checksum is checked again after the hand-over
          sha256sum --check ./*.sha256
          packages=(Constellate-Setup-"$VERSION".exe Constellate-"$VERSION"-x86_64.AppImage Constellate-"$VERSION"-amd64.deb)
          for name in "${packages[@]}"; do test -s "$name"; done
          # one list of every package's checksum, for checking several at once (sha256sum --check SHA256SUMS)
          cat ./*.sha256 > SHA256SUMS
          gh release create "$TAG" --title "Constellate $VERSION" --notes-file notes.md --verify-tag \
            "${packages[@]}" ./*.sha256 SHA256SUMS
