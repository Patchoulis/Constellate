name: Release

# Pushing a tag vX.Y.Z builds the Windows installer and publishes a GitHub release with it attached, whose
# notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build the installer and publish the release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The tag, package.json and the changelog agree on the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "::error::the tag says $version but package.json says $declared"
            exit 1
          fi
          # the lines between this version's heading and the next one
          awk -v version="$version" '
            /^## \[/ { printing = (index($0, "## [" version "]") == 1); next }
            /^\[[^]]+\]: / { next }
            printing { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entries under [$version]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer
        run: npm run dist
      - name: The installer is there and is not empty
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installer="dist/Constellate-Setup-$VERSION.exe"
          test "$(stat -c %s "$installer")" -gt 50000000
          (cd dist && sha256sum "Constellate-Setup-$VERSION.exe" > "Constellate-Setup-$VERSION.exe.sha256")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" --title "Constellate $VERSION" --notes-file notes.md --verify-tag \
            "dist/Constellate-Setup-$VERSION.exe" "dist/Constellate-Setup-$VERSION.exe.sha256"
