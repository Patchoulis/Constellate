name: CodeQL

# Code scanning: GitHub's analysis of the code itself for known kinds of flaw (injection, unsafe handling of
# untrusted input, secrets in logs...), shown under Security > Code scanning and on the pull request that adds one.
# The dependencies' known vulnerabilities are a different check (advisories.yml), and so are secrets (ci.yml).
on:
  pull_request:
    branches: [main, "feat/**"]
  push:
    branches: [main]
  schedule:
    # Mondays, after the advisories: a new query can find a flaw in code that did not change
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # to publish what it finds to the repository's code-scanning alerts
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # the interface, the desktop shell and the scripts
          - language: javascript-typescript
            build-mode: none
          # the engine (analysed from source: nothing is built)
          - language: rust
            build-mode: none
          # the workflows themselves: injection through an untrusted title or branch name, over-broad tokens
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # the security queries, and the ones about quality that most often hide a security flaw
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
