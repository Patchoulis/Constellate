name: Dependency review

# On a pull request: what the change adds to or moves in the lockfiles, refused when it brings in a dependency with
# a known vulnerability or a licence the app may not ship. The Advisories workflow checks everything already there;
# this one stops a new problem at the door, and says so on the pull request itself.
on:
  pull_request:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # to write its summary as a comment on the pull request
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # copyleft licences that would bind the whole app; deny.toml holds the full allow-list for Rust
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: on-failure
