name: CI

# Every pull request, and every push to main and to the branches work is done on. The jobs here are the checks a
# pull request must pass to be merged.
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "perf/**", "review/**", "chore/**", "refactor/**", "docs/**", "test/**", "ci/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to the commit of a release (named in the comment): a tag can be moved, a commit cannot.
jobs:
  checks:
    # The same command contributors run before asking for review: formatting, lint, types and every test.
    # On Windows, because that is where the app runs.
    name: Checks (npm run pr)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements-test.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: pip install -r apps/backend/requirements-test.txt
      # the uv the installer carries (UV_VERSION in scripts/build.mjs), for the first-start setup's tests, which
      # fail rather than skip without it when CI is set (GitHub sets it)
      - run: pip install uv==0.13.10
      - run: npm ci
      - run: npm run pr

  engine-linux:
    # The engine on a real Linux distribution (Ubuntu), not only on Windows: built, linted and tested there.
    name: Engine on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: engine-linux-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --quiet -- -D warnings
      - run: cargo test --quiet --locked

  title:
    name: Conventional title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: The pull request's title is a Conventional Commit (it becomes the squash commit's message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The title is not a Conventional Commit, e.g. \"fix(backend): read checklist answers written [N/A]\""
            exit 1
          fi

  secrets:
    name: No secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Nothing shaped like a key in the files or their history
        # bash with pipefail; and every way this could pass having looked at nothing fails instead
        shell: bash
        run: |
          patterns=.githooks/secrets.txt
          if [ ! -s "$patterns" ] || grep -qx '' "$patterns"; then
            echo "::error::$patterns is missing, empty, or has an empty line (which matches everything)"
            exit 1
          fi
          # the shapes do find a key (put together here, so that this file holds none)
          printf 'value = "AK%s%s"\n' IA ABCDEFGHIJKLMNOP | grep -Eq -f "$patterns"
          if [ "$(git rev-list --all --count)" -lt 2 ]; then
            echo "::error::the history was not fetched: nothing to scan"
            exit 1
          fi
          git log -p --all > "$RUNNER_TEMP/history.patch"
          test -s "$RUNNER_TEMP/history.patch"
          status=0
          grep -En -f "$patterns" "$RUNNER_TEMP/history.patch" > "$RUNNER_TEMP/found.txt" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::the history could not be scanned (grep exited $status)"
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            # where, but not what: the log of a public repository's run is public too
            cut -d: -f1 "$RUNNER_TEMP/found.txt" | sed 's/^/line /'
            echo "::error::$(wc -l < "$RUNNER_TEMP/found.txt") lines shaped like a secret are in the repository's history: revoke the key and rewrite the history"
            exit 1
          fi
