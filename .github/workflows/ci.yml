name: CI

# Every pull request and every push to main. The jobs here are the checks a pull request must pass to be merged.
# They run on Windows because that is where the app runs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements-test.txt
      - run: pip install -r apps/backend/requirements-test.txt
      - run: python -W ignore -m pytest -q
        working-directory: apps/backend

  web:
    name: Interface typecheck and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run typecheck
      - run: npx turbo run test --filter=@rp/web

  title:
    name: Conventional title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: The pull request's title is a Conventional Commit (it becomes the squash commit's message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::\"$TITLE\" is not a Conventional Commit title, e.g. \"fix(backend): read checklist answers written [N/A]\""
            exit 1
          fi

  secrets:
    name: No secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nothing shaped like a key in the files or their history
        run: |
          pattern='sk-ant-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|hf_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git log -p --all | grep -En "$pattern" | cut -c1-80; then
            echo "::error::something shaped like a secret is in the repository's history: revoke it and rewrite the history"
            exit 1
          fi
