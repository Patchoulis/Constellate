name: CI

# Every pull request and every push to main. The jobs here are the checks a pull request must pass to be merged.
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The same command contributors run before asking for review: formatting, lint, types and every test.
    # On Windows, because that is where the app runs.
    name: Checks (npm run pr)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r apps/backend/requirements-test.txt
      - run: npm ci
      - run: npm run pr

  engine-linux:
    # The engine on a real Linux distribution (Ubuntu), not only on Windows: built, linted and tested there.
    name: Engine on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: engine-linux-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --quiet -- -D warnings
      - run: cargo test --quiet

  title:
    name: Conventional title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: The pull request's title is a Conventional Commit (it becomes the squash commit's message)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The title is not a Conventional Commit, e.g. \"fix(backend): read checklist answers written [N/A]\""
            exit 1
          fi

  secrets:
    name: No secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nothing shaped like a key in the files or their history
        run: |
          pattern='sk-ant-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|hf_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          found="$(git log -p --all | grep -Ec "$pattern" || true)"
          if [ "$found" != "0" ]; then
            # where, but not what: the log of a public repository's run is public too
            git log -p --all | grep -En "$pattern" | cut -c1-24
            echo "::error::$found lines shaped like a secret are in the repository's history: revoke the key and rewrite the history"
            exit 1
          fi
