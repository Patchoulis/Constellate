name: Bug report
description: Something does not work, or a paper, conference or page is read wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Fill in what you can. Never paste an API key, and check logs for one before attaching them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you selected (conferences, years or date range), the settings that matter, and the paper or page it shows on.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you are on, or the commit.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: The activity log of the run, or a screenshot.
      render: text
