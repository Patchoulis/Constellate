# The Rust side of Constellate: the engine that gathers, embeds and clusters papers. It runs on the user's own
# computer as part of the desktop app; it is not a server anyone else can reach.
[workspace]
members = ["apps/engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.88: the oldest Rust that the fixed releases of ctutils (argon2's constant-time helpers, 1.87) and time (1.88)
# build with; edition 2024 alone would need 1.85
rust-version = "1.88"

[workspace.lints.rust]
# deny, not forbid: a macro of the matrix library carries its own allowance, which forbid rejects outright
unsafe_code = "deny"

[workspace.lints.clippy]
# warnings are errors in CI (`npm run pr` runs clippy with -D warnings); these are the extra ones asked for
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Tests make RSA keys and Argon2 hashes, which take seconds each without optimisation.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
