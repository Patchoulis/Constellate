# The Rust side of Constellate: the engine that gathers, embeds and clusters papers. It runs on the user's own
# computer as part of the desktop app; it is not a server anyone else can reach.
[workspace]
members = ["apps/engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
# deny, not forbid: a macro of the matrix library carries its own allowance, which forbid rejects outright
unsafe_code = "deny"

[workspace.lints.clippy]
# warnings are errors in CI (`npm run pr` runs clippy with -D warnings); these are the extra ones asked for
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
