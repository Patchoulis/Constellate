[package]
name = "constellate"
description = "Constellate's engine: papers gathered, embedded and clustered into communities, on the user's own computer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
half = "2"
# matrix products through matrixmultiply on every core: the similarity matrix is one n x n product
ndarray = { version = "0.17", features = ["matrixmultiply-threading"] }
ort = { version = "=2.0.0-rc.15", features = ["half"] }
regex = "1"
# arXiv answers in Atom XML; a read-only tree is all that is needed
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# titles compared between a conference's list and its proceedings: accents taken apart, then dropped
unicode-normalization = "0.1"
# blocking HTTP over rustls, so that no system OpenSSL is needed on Linux; redirects are followed by hand
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# addresses relative to a page or a redirect, resolved as a browser would
url = "2"

# The embedding model runs under ONNX Runtime on whatever graphics card the computer has, of any maker, and on the
# processor where there is none. Each system has its own way to reach any card:
#   Windows   DirectML (DirectX 12)
#   Linux     WebGPU, which goes through Vulkan
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["webgpu"] }

[dev-dependencies]
tempfile = "3"
