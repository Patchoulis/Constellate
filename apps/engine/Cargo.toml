[package]
name = "constellate"
description = "Constellate's engine: papers gathered, embedded and clustered into communities, on the user's own computer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The HTTP layer (src/api) is axum on tokio. TLS goes through rustls with the ring provider, so that neither a
# system OpenSSL (Linux) nor the build tools aws-lc needs are required.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
# the owner's password, kept only as an Argon2id hash (src/api/guard/login/password.rs)
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
# PKCE, state and session ids are written in base64url (RFC 7636, RFC 4648 section 5)
base64 = "0.22"
# the heap of the child process a PDF is read in, capped by its allocator (src/text/pdf/mod.rs): a hostile PDF that
# inflates to gigabytes ends that child, never the engine. A ceiling the same on every system, without unsafe code.
cap = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
getrandom = "0.3"
half = "2"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
# the ID token of a sign-in with Google (OpenID Connect): its signature checked against the provider's published
# keys (JWKS), and its claims. The pure-Rust backend, so that no C build tools are needed (aws-lc-rs would be).
# It only verifies signatures with public keys, so RUSTSEC-2023-0071 (rsa) and RUSTSEC-2026-0387 (crypto-bigint),
# timing leaks of private keys and secret integers, do not reach it (deny.toml); 12.x, a new API, brings the fixed
# rsa 0.10 and crypto-bigint 0.7.
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
# matrix products through matrixmultiply, on one thread each: the large ones are cut into rows on the engine's
# own threads (src/threads.rs). matrixmultiply's own threading (at most 4, its own pool) would otherwise run under
# those threads and multiply them.
ndarray = { version = "0.17", features = ["rayon"] }
ort = { version = "=2.0.0-rc.15", features = ["half"] }
# text out of a paper's PDF, for its reference list: pure Rust, so it builds anywhere with no system library
pdf-extract = "0.12"
# the engine's one pool of computing threads (src/threads.rs): rows of the similarity graph, papers read in
# batches, communities cut side by side; tokenizers uses it already
rayon = "1"
regex = "1"
# arXiv answers in Atom XML; a read-only tree is all that is needed
roxmltree = "0.20"
# the library is one SQLite file; `bundled` compiles SQLite in, so no system copy is needed on Windows or Linux
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.10"
subtle = "2"
# the memory this computer has free, so that no more PDF readers run at once than it can hold at their heap cap
# (src/text/pdf/mod.rs); only the part that reads memory, and without unsafe code of ours
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros", "time", "sync", "fs", "io-util"] }
# a PDF (or the range of it asked for) streamed from its file, never read whole into memory (src/api/papers/mod.rs)
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tower-http = { version = "0.7", features = ["limit", "timeout"] }
# text out of a PDF carries ligatures and odd spaces, and titles are compared without accents: both need Unicode
# normal forms
unicode-normalization = "0.1"
# blocking HTTP over rustls, so that no system OpenSSL is needed on Linux; redirects are followed by hand
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# addresses relative to a page or a redirect, resolved as a browser would
url = "2"

# The embedding model runs under ONNX Runtime on whatever graphics card the computer has, of any maker, and on the
# processor where there is none. Each system has its own way to reach any card:
#   Windows   DirectML (DirectX 12)
#   Linux     WebGPU, which goes through Vulkan
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["webgpu"] }

[dev-dependencies]
# the test's own OpenID provider signs ID tokens with RSA keys made at test time (no key is kept in the repository)
rand = "0.8"
# a self-signed certificate made at test time: no certificate or key is ever kept in the repository
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rsa = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
