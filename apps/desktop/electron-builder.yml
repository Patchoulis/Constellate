appId: app.constellate.desktop
productName: Constellate
# what Windows reads from the program file when it names the app (a firewall prompt, Task Manager): never "Electron"
copyright: Copyright © 2026 Constellate
directories:
  output: ../../dist
# Only the shell goes into the app itself; it needs nothing but Electron and Node built-ins.
files:
  - "!**/*"
  - main.cjs
  - engine.cjs
  - lifecycle.cjs
  - port.cjs
  - reader.cjs
  - reader-guard.cjs
  - icon.png
  - package.json
# The interface's server and the licences are added by after-pack.cjs.
afterPack: ./after-pack.cjs
extraResources:
  # the engine and the libraries ONNX Runtime loads beside it, staged by scripts/build.mjs --dist (engine-files.cjs)
  - from: engine
    to: engine
win:
  target: nsis
  executableName: Constellate
  icon: icon.png
  artifactName: Constellate-Setup-${version}.${ext}
nsis:
  oneClick: true
  # the installer does not open the app itself: a silent install must not start a second copy behind the user's
  runAfterFinish: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallDisplayName: Constellate
  # the uninstaller asks whether to remove what the app downloaded as well (installer.nsh)
  include: installer.nsh
  deleteAppDataOnUninstall: false
# Linux: an AppImage (runs as it is, on any distribution with glibc 2.38 or newer) and a .deb (Ubuntu 24.04, Debian 13)
linux:
  target:
    - AppImage
    - deb
  executableName: constellate
  icon: icon.png
  category: Science
  synopsis: Research papers gathered, embedded and split into communities
  description: Gathers research papers from conference lists and arXiv, embeds and clusters them on this computer, and helps a researcher find what matters.
  maintainer: Constellate
  artifactName: Constellate-${version}-${arch}.${ext}
