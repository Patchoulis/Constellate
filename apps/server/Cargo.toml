[package]
name = "constellate"
description = "Constellate's backend: papers gathered, embedded, clustered into communities, and served to the interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
